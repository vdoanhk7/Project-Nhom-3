name: Build Fat JARs

on:
  push:
    branches: ["main", "QuangAnh"]
  pull_request:
    branches: ["main", "QuangAnh"]
  workflow_dispatch:

jobs:
  build-fat-jars:
    name: Build server and client fat JARs
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build fat JARs
        run: mvn --batch-mode -DskipTests clean package

      - name: Verify fat JAR manifests
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $expectedMainClasses = @{
            "dist/server-app.jar" = "com.nhom3.server.ServerMain"
            "dist/client-app.jar" = "com.nhom3.client.Main"
          }

          foreach ($jarPath in $expectedMainClasses.Keys) {
            if (-not (Test-Path $jarPath)) {
              throw "Missing fat JAR: $jarPath"
            }

            $zip = [System.IO.Compression.ZipFile]::OpenRead($jarPath)
            try {
              $manifestEntry = $zip.GetEntry("META-INF/MANIFEST.MF")
              if ($null -eq $manifestEntry) {
                throw "Missing manifest in $jarPath"
              }

              $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
              try {
                $manifest = $reader.ReadToEnd()
              } finally {
                $reader.Dispose()
              }

              $expectedMainClass = $expectedMainClasses[$jarPath]
              if ($manifest -notmatch "Main-Class:\s+$([regex]::Escape($expectedMainClass))") {
                throw "Invalid Main-Class in $jarPath. Expected $expectedMainClass."
              }
            } finally {
              $zip.Dispose()
            }
          }

      - name: Upload fat JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auction-fat-jars
          path: |
            project/dist/server-app.jar
            project/dist/client-app.jar
